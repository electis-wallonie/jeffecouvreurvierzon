<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logistics Quest – Exam Quiz</title>
<style>
:root{
  --bg:#0e1230; --bg2:#171c47; --card:#1f2559; --card2:#2a3170; --txt:#f2f4ff; --mut:#9aa3d6;
  --acc:#ffcc33; --acc2:#7c5cff; --ok:#2ee59d; --bad:#ff5d73; --blue:#4cc9ff;
}
*{box-sizing:border-box}
html{background-color:#0e1230;color-scheme:dark}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f2f4ff;
  background-color:#0e1230;
  background-image:radial-gradient(1200px 700px at 80% -10%,#2b2f86 0,transparent 60%);
  background-repeat:no-repeat;min-height:100vh;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.9rem;margin:.2em 0}
h2{margin:.2em 0 .6em}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg2);border:1px solid #ffffff14;border-radius:16px;padding:12px 16px}
.lvl{font-weight:800;color:var(--acc)}
.xpbar{flex:1;min-width:140px;height:12px;background:#0006;border-radius:99px;overflow:hidden}
.xpbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .6s}
.pill{background:#0005;border-radius:99px;padding:4px 12px;font-size:.85rem;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:14px 0}
.chap{background:var(--card);border:1px solid #ffffff14;border-radius:16px;padding:14px;cursor:pointer;text-align:left;color:var(--txt);font:inherit;transition:transform .15s,border-color .15s}
.chap:hover,.chap:focus-visible{transform:translateY(-3px);border-color:var(--acc);outline:none}
.chap b{display:block;font-size:1rem}
.chap small{color:var(--mut)}
.stars{color:var(--acc);letter-spacing:2px;margin-top:6px;min-height:1.2em}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.mode{border:0;border-radius:16px;padding:16px;font:inherit;color:#fff;cursor:pointer;text-align:left;font-weight:700;transition:transform .15s}
.mode:hover{transform:translateY(-3px)}
.mode small{display:block;font-weight:400;opacity:.9;margin-top:4px}
.m1{background:linear-gradient(135deg,#7c5cff,#4cc9ff)}
.m2{background:linear-gradient(135deg,#ff5d73,#ff9a44)}
.m3{background:linear-gradient(135deg,#17b978,#2ee59d);color:#04281b}
.m4{background:linear-gradient(135deg,#d45cff,#7c5cff)}
.opt-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:.9rem}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.badge{background:var(--card);border-radius:12px;padding:8px 12px;font-size:.85rem;opacity:.35;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;border:1px solid var(--acc)}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hud .pill b{color:var(--txt)}
.hearts{font-size:1.2rem;letter-spacing:2px}
.prog{height:10px;background:#0006;border-radius:99px;overflow:hidden;margin-bottom:12px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--acc2));transition:width .3s}
.timer{height:6px;background:#0006;border-radius:99px;overflow:hidden;margin-bottom:12px}
.timer>i{display:block;height:100%;width:100%;background:var(--ok)}
.q{background:var(--card);border:1px solid #ffffff14;border-radius:18px;padding:18px}
.q .tag{font-size:.75rem;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}
.q h3{font-size:1.2rem;line-height:1.4;margin:.4em 0 1em}
.ans{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card2);color:var(--txt);border:2px solid transparent;border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer;transition:transform .12s,border-color .12s}
.ans:hover:not(:disabled){border-color:var(--acc2);transform:translateX(3px)}
.ans kbd{background:#0005;border-radius:6px;padding:1px 8px;font-size:.85rem;color:var(--acc)}
.ans.ok{background:#12664a;border-color:var(--ok)}
.ans.bad{background:#6b2030;border-color:var(--bad);animation:shake .3s}
.ans:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:#0004;border-left:4px solid var(--acc);line-height:1.45}
.fb.ok{border-color:var(--ok)} .fb.bad{border-color:var(--bad)}
.btn{background:var(--acc);color:#241a00;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:800;cursor:pointer;margin-top:12px}
.btn.sec{background:var(--card2);color:var(--txt)}
.xpfloat{position:fixed;left:50%;top:30%;transform:translateX(-50%);font-size:2rem;font-weight:900;color:var(--acc);pointer-events:none;animation:up 1s forwards;text-shadow:0 2px 12px #000}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
.big{font-size:3.2rem;font-weight:900;color:var(--acc)}
.center{text-align:center}
.rev{background:var(--card);border-radius:12px;padding:12px;margin:8px 0;font-size:.92rem;line-height:1.45;text-align:left}
.rev .g{color:var(--ok)} .rev .r{color:var(--bad)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;right:12px;bottom:12px;background:var(--card2);border:1px solid var(--acc);border-radius:12px;padding:10px 14px;z-index:60;animation:up2 .4s}
@keyframes up2{from{transform:translateY(20px);opacity:0}}
a.link{color:var(--blue);cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top" id="top"></div>
  <div id="app"></div>
</div>

<script>
/* ============ QUESTION BANK (based on the slides, ch. 1-6 and 12) ============ */
const CH = {
  1:"Logistics Overview",
  2:"Logistics & Information Technology",
  3:"Strategic and Financial Logistics",
  4:"Organizational and Managerial Issues",
  5:"The Supply Chain Management Concept",
  6:"Procurement",
  12:"Transportation"
};
const Q = [];
function q(c,t,good,bad,e){Q.push({c,t,good,bad,e});}

/* ---------- Chapter 1 ---------- */
q(1,"Which economic utility corresponds to having products available at the moment the customer needs them?","Time utility",["Place utility","Form utility","Possession utility"],"Time utility = availability at the right moment (perishable / non-perishable products).");
q(1,"Moving a product from a warehouse (low value) to a supermarket (higher value) creates which utility?","Place",["Time","Form","Possession"],"Place utility: the product is moved to where its value is higher.");
q(1,"Breaking thousands of cases of diet cola into the smaller quantities customers want illustrates which utility?","Form",["Place","Time","Possession"],"Form utility: logistics transforms quantities (e.g. diet cola).");
q(1,"Possession utility is mostly influenced by…","The payment terms associated with the product",["Delivery speed","Storage location","Packaging"],"Possession utility = transfer of ownership, tied to payment terms.");
q(1,"According to CSCMP, logistics is the part of SCM that plans, implements and controls…","The forward AND reverse flow and storage of goods, services and information",["Only the transport of finished goods","Only information flows","Only the purchase of raw materials"],"The CSCMP definition includes forward AND reverse flow, from point of origin to point of consumption.");
q(1,"Which of these factors is NOT cited as a reason for the growing importance of logistics?","An increase in economic regulation",["A reduction in economic regulation","Technological advances","Globalization of trade"],"The slide cites a REDUCTION in regulation (deregulation), not an increase.");
q(1,"'Disintermediation' refers to…","Removing intermediaries between producer and consumer",["Adding a logistics intermediary","The merger of two carriers","Reducing inventory"],"Disintermediation = removal of intermediation between producer and consumer (e.g. online sales).");
q(1,"The total cost approach says that…","A change in one activity raises some costs and lowers others: everything must be considered together",["Each cost must be minimized separately","Only transportation cost matters","Inventory costs are always the most important"],"Cost trade-offs: e.g. lower transportation cost often means higher warehousing cost.");
q(1,"A classic cost trade-off is…","Lower transportation costs ↔ higher warehousing costs",["Lower inventory ↔ lower transportation","Higher sales ↔ higher price","Lower price ↔ higher quality"],"Direct example from the slide: transportation ↓ often paired with warehousing ↑.");
q(1,"'Postponement' consists of…","Delaying value-added activities (assembly, packaging…) as late as possible",["Delaying payment to suppliers","Postponing a delivery to the customer","Lengthening production runs"],"Some operations once done at the factory are now done in the warehouse.");
q(1,"'Landed cost' is…","The product price plus transportation costs",["Production cost only","The retail selling price","The annual storage cost"],"Landed cost = product price + transportation costs.");
q(1,"Which function does the logistics channel contribute to the overall channel process?","The sorting function",["The financing function","The negotiating function","The promotion function"],"The logistics channel contributes the 'sorting function'.");
q(1,"In marketing channels, which intermediaries facilitate the logistics channel?","Freight forwarders",["Banks","Brokers","Advertising agencies"],"Banks = ownership/financing; brokers = negotiation; agencies = promotion; forwarders = logistics.");
q(1,"Starbucks set up inside Marriott hotels is an example of…","Co-branding",["Postponement","Disintermediation","Omnichannel"],"Related logistics question: deliver separately or co-load the vehicles?");
q(1,"Which is an entry-level logistics position (according to the chapter)?","Logistics / supply chain analyst",["Transportation director","Warehouse operations manager","Purchasing manager"],"Entry-level: analyst, consultant, customer service manager, fulfillment supervisor. The others = second level.");

/* ---------- Chapter 2 ---------- */
q(2,"What is a benefit of effectively using information in logistics?","More supply chain visibility and shorter lead times",["Less need for coordination","Longer order processing","Reduced visibility of demand"],"Visibility, POS data, coordination of production/marketing/distribution, simplified order processing.");
q(2,"Which office-system tool is most relevant to logisticians?","The spreadsheet",["The word processor","The presentation tool","The fax machine"],"Spreadsheets allow what-if analysis and some optimization models (e.g. the 'What's Best' add-in).");
q(2,"Which technology was the 'gold standard' of logistics in the 1990s?","EDI (electronic data interchange)",["GPS","The iPad","The cloud"],"EDI = 1990s; wireless communication = first decade of the 2000s.");
q(2,"A transaction processing system (TPS) can process…","In real time or in batches",["Only in real time","Only in batches","Only manually"],"TPS: real-time processing OR batch processing.");
q(2,"Compared with bar codes, RFID…","Needs no direct line of sight and stores more data",["Requires a direct line of sight","Is read-only","Stores less data"],"RFID: no line of sight, more data, read AND write.");
q(2,"An RFID system consists of…","A scanning antenna, a tag/chip, and a transceiver that interprets the data",["A screen, keyboard and scanner","A satellite and a GPS receiver","A server and a router"],"Scanning antenna + RFID tag + transceiver.");
q(2,"A logistics information system (LIS) is…","The people, equipment and procedures that collect, sort, analyze and distribute information to logistics decision makers",["Accounting software","A type of sensor","A network of carriers"],"Definition adapted from Kotler & Armstrong.");
q(2,"Simulation, as a DSS technique, consists of…","Modeling a real system, often with mathematical equations",["Extracting correlations from large databases","Automating payments","Tracking parcels by GPS"],"Extracting correlations = data mining.");
q(2,"A TMS (Transportation Management System) is…","Software that automates order building, load management, tracking, auditing and payment of shipments",["Software that manages flows inside the warehouse","A complete ERP","A central database"],"Software supervising storage and material flows in the warehouse = WMS.");
q(2,"Data mining depends on…","Data warehouses",["Bar codes","Purchasing cards","Reverse auctions"],"Data warehouse = central repository of all the organization's relevant data.");
q(2,"What is a disadvantage of ERP systems cited in the chapter?","High cost and long installation time, weak logistics-specific capabilities (TMS/WMS) at first",["They don't share data between functions","They only work in batch mode","They are free but unreliable"],"Installation costs, lengthy installation, initial lack of logistics-specific functions.");
q(2,"Compared with in-store retail, online selling is characterized by…","More, smaller orders, with item-level picking and a higher return rate",["Fewer but larger orders","Full-case picking","Lower returns from resellers"],"Online: open-case picking, parcels/envelopes, high returns from end consumers.");
q(2,"What is an advantage of cloud computing / software on demand?","Pay-as-you-go: no large upfront investment, faster installation",["Unlimited customization","No security problems","Updates are never frequent"],"Disadvantages: too many updates, limited customization, security.");
q(2,"Which of these is a disadvantage of cloud computing?","Limited customization and security issues",["Need for a larger IT staff","Slower installation","High capital expenditure"],"Cloud strengths: OPEX, speed, small IT team, regular updates.");
q(2,"The four categories of e-procurement benefits are…","Transactional, compliance, management information, and price benefits",["Tax, legal, social and logistics","Strategic, tactical, operational and human","Quality, cost, lead time and service"],"Transactional, compliance, management information, price benefits.");
q(2,"The Internet of Things (IoT) refers to…","Sensors and communications embedded in physical objects to track and control them over the Internet",["A professional social network","Payroll software","An EDI standard"],"Applications: warehousing, transportation, last-mile delivery.");

/* ---------- Chapter 3 ---------- */
q(3,"What are the three generic strategies of an organization?","Cost leadership, differentiation, focus",["Growth, retention, diversification","Push, pull, hybrid","Local, regional, global"],"Cost leadership, differentiation, focus.");
q(3,"The 'cost leadership' strategy consists of…","Becoming the lowest-cost producer in the industry for a given level of quality",["Offering unique attributes valued by the customer","Concentrating on a narrow market","Raising prices"],"Differentiation = unique attributes; focus = narrow market.");
q(3,"The focus strategy…","Concentrates efforts on a narrowly defined market to gain either a cost OR a differentiation advantage",["Targets all segments","Applies only to luxury products","Eliminates logistics"],"Focus strategy = niche, with either a cost or a differentiation advantage.");
q(3,"Which of these decisions is a logistics strategy decision?","Determining the number and location of warehouses",["Choosing the color of a product","Setting the promotional price","Hiring the accountant"],"Also: choosing transportation modes, deploying inventory, technology investments.");
q(3,"How can finance influence logistics strategy?","Rates of return can decide between running your own warehouse or using a 3PL",["By setting production run lengths","By choosing packaging","By defining the product range"],"Direct example from the slide.");
q(3,"A manufacturing decision to adopt just-in-time (JIT) influences…","Warehousing, transportation and inventory management",["Only purchasing","Only marketing","No logistics activity"],"Manufacturing → JIT → logistics impacts.");
q(3,"The income statement presents, for a period…","Revenues, expenses and profit",["Assets, liabilities and equity","Cash inflows and outflows","Inventory and receivables"],"Also called the P&L (profit and loss statement).");
q(3,"The balance sheet reflects, at a point in time…","Assets, liabilities and owner's equity",["Revenues and expenses","Cash flows","Performance ratios"],"Owner's equity = what the company owns − what it owes.");
q(3,"The statement of cash flows shows…","How the organization generates cash and where it uses it",["What the company owns","The value of inventory","Net profit only"],"Positive cash flow allows operations to continue, investment, and meeting obligations.");
q(3,"In the Strategic Profit Model, ROA equals…","Net profit margin × asset turnover",["Net profit margin + asset turnover","Sales / net profit","Assets / sales"],"ROA = net profit margin × asset turnover.");
q(3,"Net profit margin is calculated as…","Net profit / sales",["Sales / total assets","Net profit / assets","Costs / sales"],"Net profit margin = net profit / sales.");
q(3,"Asset turnover is calculated as…","Total sales / total assets",["Net profit / sales","Assets / sales","Inventory / costs"],"It indicates how efficiently capital is used. The most relevant logistics asset: inventory.");
q(3,"What is a drawback of the Strategic Profit Model?","It ignores the timing of cash flows and can be manipulated in the short term",["It uses no ratios","It ignores sales","It doesn't apply to logistics"],"Another limit: it doesn't recognize assets dedicated to specific relationships.");
q(3,"The four perspectives of the Balanced Scorecard are…","Customers, internal processes, learning and growth, financial results",["Cost, quality, lead time, service","Purchasing, production, sales, logistics","Strategic, tactical, operational, human"],"The BSC forces a look beyond traditional financial measures.");
q(3,"Accounts receivable represent…","Money that customers owe the organization",["Money the organization owes suppliers","The value of inventory","Share capital"],"Logistics can influence how quickly invoices get paid.");

/* ---------- Chapter 4 ---------- */
q(4,"A 'fragmented' logistics structure is one where…","Logistics activities are managed across several departments",["All activities are in a single department","There is no manager","Everything is outsourced"],"Unified = activities combined in one department.");
q(4,"A centralized logistics organization…","Has a single logistics department that administers everything from headquarters",["Decides by division or region","Has no logistics department","Outsources everything"],"Decentralized = decisions at the level of divisions / product groups / regions.");
q(4,"What are the three organizational design types for logistics?","Hierarchical (functional), matrix, network",["Centralized, decentralized, hybrid","Unified, fragmented, mixed","Vertical, horizontal, diagonal"],"Hierarchical = top-down; matrix = cross-functional responsibilities; network = value-creating processes.");
q(4,"In the network design, 'responsiveness' refers to…","The ability to respond to unique or unexpected customer requests",["Meeting current and emerging customer needs","The ability to cope with unexpected operating situations","Reducing defects"],"Relevancy = current/emerging needs; flexibility = unexpected situations, avoiding irreversible commitments.");
q(4,"Productivity is defined as…","Output / input",["Input / output","Output − input","Profit / sales"],"Three ways to improve it: reduce input, increase output, or both.");
q(4,"Labor productivity improvement efforts in logistics often aim to…","Increase output while keeping input constant",["Cut wages","Reduce output","Lay off massively"],"Workers resist pay cuts.");
q(4,"Why can excess capacity hurt productivity?","It can lead to buying extra equipment/facilities (input ↑) with no additional output",["It always increases output","It lowers fixed costs","It improves quality"],"Getting more output from existing assets = productivity ↑.");
q(4,"Logistics service quality that exceeds what the customer expects…","May add unnecessary costs",["Is always beneficial","Always reduces costs","Has no effect"],"Quality must be aligned with customer expectations.");
q(4,"ISO 9000 is…","A set of generic standards to document, implement and demonstrate quality management systems",["A U.S. quality award","A statistical defect-reduction method","A safety law"],"Applies to industries AND services.");
q(4,"Regarding ISO 9000 certification…","Annual audits and recertification every three years",["Audit every 10 years","No audit after certification","Monthly recertification"],"It is associated with better customer service and order accuracy.");
q(4,"Six Sigma aims for a level of…","3.4 defects per million opportunities",["34 defects per million","3.4 defects per thousand","Guaranteed zero defects"],"99.99966% of the normal curve at six standard deviations.");
q(4,"What is a cited disadvantage of Six Sigma?","Cultural barriers, resources to invest, management commitment",["It increases errors","It lengthens cycles","It eliminates quality"],"Advantages: cost reduction, fewer errors/waste, shorter cycle times.");
q(4,"Lean Six Sigma is unique because…","It integrates Six Sigma and Lean: you cannot focus on quality or speed alone",["It ignores quality","It is reserved for hospitals","It replaces ISO 9000"],"Emphasis on quality tied to responsiveness.");
q(4,"The Malcolm Baldrige award…","Is reserved for companies headquartered in the United States",["Is global","Is an ISO certification","Is limited to logistics companies"],"Created in the late 1980s, extended to healthcare and education.");
q(4,"A 'catastrophic' risk is for example…","An earthquake or a terrorist attack",["Demand variability","A damaged parcel","A delivery delay"],"Operational risks: demand variability, shipment damage.");
q(4,"Which program imposes '10+2'?","The Importer Security Filing (ISF)",["C-TPAT","CSI","TWIC"],"ISF = 10+2. CSI = Container Security Initiative. C-TPAT = customs-trade partnership against terrorism.");
q(4,"Pilferage is…","Theft committed by employees",["Theft by pirates","Data theft","Accidental loss"],"Managed from hiring, zero-tolerance policy, keeping goods in motion.");
q(4,"Reverse logistics…","Can cost 4 to 5 times more than forward logistics and involve 12 times more steps",["Costs less than forward logistics","Is simple and fast","Represents less than $1 billion in the US"],"It exceeds $100 billion in the United States.");
q(4,"The three types of logistics complexity are…","Network, process, and range complexity",["Human, financial, legal","Local, national, global","Technical, social, political"],"Network = nodes/links; process = processes added over time; range = number of products.");

/* ---------- Chapter 5 ---------- */
q(5,"The Supply Chain Management concept is…","Relatively young, rarely mentioned before 1990",["Born in the 1920s","Used since the 19th century","Invented in 2010"],"Recognition came from the value of coordinating functions.");
q(5,"According to CSCMP, the relationship between logistics and SCM is that…","SCM includes logistics management activities",["Logistics includes SCM","They are identical","They are unrelated"],"Logistics is part of SCM.");
q(5,"What is the main difference between the SCOR and GSCF models?","GSCF involves all of the firm's functions; SCOR focuses on logistics, operations and purchasing",["SCOR is more cross-functional than GSCF","They are identical","GSCF only covers transportation"],"Degree of cross-functional involvement.");
q(5,"What are the six processes of the SCOR model?","Plan, Source, Make, Deliver, Return, Enable",["Buy, Make, Move, Sell, Pay, Plan","Plan, Order, Ship, Bill, Return, Audit","Source, Stock, Sell, Ship, Serve, Save"],"Plan, source, make, deliver, return, enable.");
q(5,"How many processes does the GSCF model include?","Eight",["Six","Four","Twelve"],"Including CRM, customer service management, demand management, order fulfillment, returns management…");
q(5,"A 'fast' vs 'agile' supply chain: agile emphasizes…","The ability to respond to changes in demand volume and variety",["Speed only","The lowest cost","Inventory reduction"],"Fast = speed/time; agile = volume/variety flexibility.");
q(5,"Traditional chains are… while customer-centric chains are…","Push-oriented, factory-driven / pull-oriented",["Pull-oriented / push-oriented","Customer-driven / factory-driven","Both push"],"Traditional: internal cost metrics; customer-centric: holistic metrics.");
q(5,"The 'perfect order' requires…","On-time delivery, undamaged, in the right quantity — simultaneously",["Only on-time delivery","The lowest price","Luxury packaging"],"A multiplicative measure from the customer's point of view.");
q(5,"An agile chain is most suitable when…","Demand is volatile and the need for variety is high",["Demand is stable and variety is low","There are no customers","Costs are fixed"],"Lean = stable demand, low variety.");
q(5,"'Leagility' is…","A hybrid approach combining lean and agile",["A purely lean approach","A software package","A type of warehouse"],"One part of the chain is responsive, the other smooths production.");
q(5,"The bullwhip effect is characterized by…","Increasing variability of orders between chain members",["Stable orders","Falling prices","Reduced transportation"],"Lean chains seek to reduce it.");
q(5,"Relational exchanges are based on a philosophy of…","'What's in it for US?'",["'What's in it for ME?'","'At the lowest price'","'Win at all costs'"],"Transactional = 'What's in it for me?'.");
q(5,"Which is an attribute of relational exchange?","Trust, commitment, dependence, joint investment, shared benefits",["Distrust and price competition","One-day contracts","Anonymity"],"The five attributes from the chapter.");
q(5,"Which level of collaboration offers the best improvement opportunity, according to the chapter?","Strategic collaboration",["Transactional collaboration","Tactical information sharing","No collaboration"],"Transactional and tactical are the most widespread; strategic is increasing.");
q(5,"A 'supply chain partnership' is characterized by…","Strong interdependence, information sharing, compatible goals, decisions based on value rather than price",["Low interdependence","Decisions based on price only","Lack of trust"],"Example of strategic collaboration.");
q(5,"3PL (third-party logistics) is…","Any logistics activity not performed in-house (outsourcing)",["An internal inventory management company","A purchasing department","TMS software"],"Examples: DHL Supply Chain, Kuehne+Nagel, DB Schenker, UPS Supply Chain Solutions.");
q(5,"The main purpose of a 4PL / Lead Logistics Provider is to…","Ensure the different 3PLs work toward supply chain objectives, while remaining neutral",["Transport the goods","Manufacture the products","Replace the customers"],"It must have expertise in supply chain trade-offs.");
q(5,"What is a cause of logistics outsourcing failure?","Unrealistic expectations and lack of flexibility in the relationship",["Too much transparency","Too much mutual trust","Costs that are too low"],"A 3PL can improve efficiency and effectiveness, but can also fail.");
q(5,"Which is NOT an obstacle to SCM implementation?","Compatible information systems",["Lack of management commitment","Reluctance to share data","Incompatible corporate cultures"],"The real obstacle: INCOMPATIBLE information systems.");

/* ---------- Chapter 6 ---------- */
q(6,"Procurement costs often represent…","60 to 80% of revenue",["5 to 10%","20 to 30%","100%"],"Hence the increasingly strategic orientation of purchasing.");
q(6,"'Supply management' is seen as…","A relational exchange approach with a limited number of suppliers",["A one-off purchase","A reverse auction","Quality control"],"'Procurement' and 'purchasing' are sometimes synonyms.");
q(6,"An advantage of purchasing cards (p-cards) is…","Fewer invoices and purchases made in minutes rather than days",["More invoices","Slower supplier payments","No spend control"],"A single monthly payment regardless of the number of cardholders.");
q(6,"What is a challenge of expanding p-cards internationally?","Differences in currencies, technology, acceptance and culture",["Too many local suppliers","No currency","Too much control"],"Four challenges cited in the slides.");
q(6,"What is the first step of the supplier selection and evaluation process?","Identify the sourcing need",["Select the suppliers","Evaluate the decision","Negotiate the price"],"Order: need → situation analysis → identification/evaluation → selection → decision evaluation.");
q(6,"'Single sourcing' consists of…","Using only one supplier for a given need",["Using several suppliers","Buying abroad","Making in-house"],"Opposite: multiple sourcing.");
q(6,"The 'process-based' evaluation approach corresponds to…","An audit of the supplier's service/production process",["Measuring its actual performance","A price ranking","An auction"],"The performance-based approach looks at actual cost and quality (scorecards).");
q(6,"'Supplier scorecards' are used to…","Report supplier performance",["Pay suppliers","Negotiate contracts","Audit inventory"],"Tool of the performance-based approach.");
q(6,"The Kraljic matrix classifies purchases according to…","Their importance and the complexity of the supply market",["Their price and color","Their size and weight","Their country and lead time"],"Goal: minimize supply vulnerability and maximize purchasing power.");
q(6,"Supplier development (reverse marketing) refers to…","Aggressive buyer involvement: the buyer initiates contact and sets price and terms",["The supplier solicits the buyer","Closing the supplier","Buying abroad"],"Motivation: inefficiencies of supplier-initiated marketing.");
q(6,"The two driving strategies of global sourcing are…","Factor-input (low cost/quality) and market access",["Price and promotions","Speed and volume","Push and pull"],"Sourcing where you plan to sell = market access.");
q(6,"What is an example of a hidden cost of global sourcing?","Changes in duties and taxes during the contract",["Falling ocean freight","Inventory reduction","Fewer suppliers"],"Also: higher management costs, increased inventory, logistics cost volatility.");
q(6,"The five dimensions of social responsibility in purchasing are…","Diversity, environment, human rights, philanthropy, safety",["Price, quality, lead time, service, volume","Hierarchy, matrix, network, flow, stock","Local, global, regional, national, urban"],"Sustainable purchasing integrates social and environmental considerations.");
q(6,"In investment recovery, 'waste' refers to…","Damaged, unusable materials with no economic value",["Excess inventory","Obsolete materials","Materials in good condition that can be resold"],"Excess = beyond needs; obsolete = will no longer be used; scrap = unusable/by-product; waste = no value.");
q(6,"Supply chain finance allows…","Buyers to extend their payment terms while paying suppliers earlier",["Doubling inventory","Eliminating suppliers","Reducing the treasury"],"Facilitated by FinTechs with cloud software.");
q(6,"Which is an ethical issue in purchasing?","Bribes and kickbacks, conflicts of interest",["Reducing lead times","Using a scorecard","Conducting an audit"],"Also: gifts, misuse of information, lying.");

/* ---------- Chapter 12 ---------- */
q(12,"What are the five modes of transportation?","Air, motor carrier (road), pipeline, rail, water",["Air, road, bicycle, boat, drone","Rail, road, tunnel, cable, sea","Air, road, rail, walking, space"],"Air, motor carrier, pipeline, rail, water.");
q(12,"What are the six attributes that determine a mode's appeal?","Cost, speed, reliability, capability, capacity, flexibility",["Price, color, weight, size, volume, age","Cost, brand, quality, date, place, size","Speed, duration, footprint, rate, ratio, index"],"Cost, speed, reliability, capability, capacity, flexibility.");
q(12,"Air freight is best suited to…","High-value, low-volume, urgent or perishable products",["Low-value bulk","Crude oil","Scrap metal"],"Fast for more than 600 miles, but expensive.");
q(12,"Air rates are based on…","Dimensional weight",["The selling price","Distance only","The color of the package"],"Dimensional weight.");
q(12,"What is the main reliability difficulty of air freight?","Congestion from passenger traffic (belly freight) and weather",["Sandstorms only","Rail freezes","Canal droughts"],"Fog, snow, thunderstorms.");
q(12,"What is the main advantage of motor carrier transportation?","Flexibility",["The lowest cost","The highest capacity","The lowest speed"],"Cost is generally lower than air freight.");
q(12,"LTL (less-than-truckload) refers to…","Shipments of 150 to 10,000 pounds: too big for manual handling, too small to fill a truck",["Shipments over 50,000 pounds","Parcels under 150 pounds","Liquids only"],"LTL trucks carry shipments from several shippers through a network of terminals.");
q(12,"Why are TL rates lower than LTL rates?","Direct loading from shipper to consignee without going through terminals, and similar administration",["Because trucks are slower","Because products are lighter","Because there are fewer carriers"],"The shipper loads, the consignee unloads; administrative costs nearly identical for 25,000 vs 250 pounds.");
q(12,"Which mode is the only one without vehicles and the most reliable, but also the slowest?","Pipeline",["Rail","Water","Air"],"Carries only liquids or gases; high fixed costs, low unit cost.");
q(12,"In rail transportation, the chapter says rail is…","Neither 'the best' nor 'the worst' on any of the six attributes",["The best at everything","The worst at everything","The fastest"],"Cheaper than air and motor carrier, more expensive than pipeline and water.");
q(12,"Water transportation is characterized by…","Slow, relatively cheap, low-value bulk, large volumes",["Very fast and expensive","Very reliable","Liquids only"],"Unreliable due to drought, ice, aging locks.");
q(12,"Intermodal transportation is…","The use of a container that can be transferred from one mode to another without reloading its contents",["The use of a single mode","A type of contract","Transportation insurance"],"Example: piggyback (trailer or container on a flatcar).");
q(12,"A TEU is…","A unit equivalent to a 20-foot container",["A 40-foot container","A type of truck","A unit of weight"],"Twenty-foot Equivalent Unit.");
q(12,"ULDs (unit load devices) are…","Containers designed specifically for aircraft fuselages",["Containers for trains","Software","Refrigerated trucks"],"For air freight.");
q(12,"Freight forwarders exist to provide a service…","To shippers who lack enough volume for TL rates: consolidation and pickup/delivery",["For massive-volume shippers only","Of rail transportation exclusively","Of warehouse rental"],"They generally don't do the line-haul themselves.");
q(12,"'Shippers' associations' are…","Non-profit organizations seeking the lowest rates for their members",["Airlines","Government agencies","For-profit brokers"],"Similar to forwarders but non-profit.");
q(12,"Transportation brokers…","Match a shipper's freight with a carrier",["Own all their trucks","Regulate prices","Build roads"],"In TL, they retain a carrier and receive a share of the fees.");
q(12,"A parcel weighs up to…","150 pounds",["10 pounds","1,000 pounds","10,000 pounds"],"Parcel carriers: USPS, UPS, FedEx Express…");
q(12,"Which U.S. agency is responsible for rail transportation safety?","Federal Railroad Administration (FRA)",["FAA","FMCSA","USCG"],"FAA = air; FMCSA = trucks/buses; OPS = pipelines; USCG = maritime; DOT = all modes.");
q(12,"What happened after economic deregulation?","The CAB was abolished in 1985, the ICC in 1995, and the STB was created",["The ICC was abolished in 1985","The STB was abolished in 1995","Nothing changed"],"Deregulation began in the 1970s.");
q(12,"What are the types of for-hire carriers?","Common, contract, exempt",["Private, public, mixed","Fast, slow, medium","National, regional, local"],"The private carrier is exempt from economic regulation.");
q(12,"A private carrier is…","A company whose main business is not transportation but which handles its own transport",["A carrier serving the general public","A brokerage firm","A state-owned transport company"],"Common = general public; contract = specialized contract.");

/* ============ STATE & TOOLS ============ */
const $ = s => document.querySelector(s);
const app = $("#app"), topEl = $("#top");
const LEVELS = [
  [0,"Intern"],[150,"Logistics Analyst"],[400,"Supervisor"],[800,"Transportation Manager"],
  [1400,"Supply Chain Director"],[2200,"SCM Legend"]
];
const BADGES = {
  first:["🚚","First parcel delivered"], s5:["🔥","Streak of 5"], s10:["⚡","Streak of 10"],
  perfect:["💎","Perfect order (100%)"], surv:["🛡️","Survivor (15+ in Survival mode)"],
  exam:["🎓","Mock exam ≥ 16/20"], all:["🏆","All chapters completed"], speed:["⏱️","Lightning (5 answers < 5 s)"]
};
let S = {xp:0, best:{}, badges:{}, wrong:[], speedCount:0};
try{ const r=localStorage.getItem("logiquest_en"); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){}
function save(){ try{localStorage.setItem("logiquest_en",JSON.stringify(S));}catch(e){} }
function lvlInfo(){
  let i=0; for(let k=0;k<LEVELS.length;k++) if(S.xp>=LEVELS[k][0]) i=k;
  const cur=LEVELS[i][0], nxt=LEVELS[i+1]?LEVELS[i+1][0]:cur+1;
  return {i, name:LEVELS[i][1], pct: LEVELS[i+1]? Math.min(100,(S.xp-cur)/(nxt-cur)*100):100};
}
function renderTop(){
  const L=lvlInfo();
  topEl.innerHTML=`<div class="lvl">Lvl ${L.i+1} · ${L.name}</div>
   <div class="xpbar" title="${S.xp} XP"><i style="width:${L.pct}%"></i></div>
   <div class="pill">${S.xp} XP</div>
   <div class="pill">${Object.keys(S.badges).length}/${Object.keys(BADGES).length} badges</div>`;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}
function giveBadge(k){ if(!S.badges[k]){S.badges[k]=1;save();toast("🏅 Badge: "+BADGES[k][1]);fx(60);} }

/* confetti */
const cv=$("#fx"), cx=cv.getContext("2d"); let parts=[];
function fit(){cv.width=innerWidth;cv.height=innerHeight;} addEventListener("resize",fit); fit();
function fx(n){
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,
    c:`hsl(${Math.random()*360},90%,60%)`,s:4+Math.random()*5,l:90});
  if(parts.length===n) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s);});
  parts=parts.filter(p=>p.l>0&&p.y<cv.height);
  if(parts.length) requestAnimationFrame(loop); else cx.clearRect(0,0,cv.width,cv.height);
}

/* ============ HOME SCREEN ============ */
let opts={timer:false};
function home(){
  renderTop();
  const cards=Object.keys(CH).map(k=>{
    const n=Q.filter(x=>x.c==k).length, b=S.best[k]||0;
    const st=b>=100?"★★★":b>=80?"★★☆":b>=50?"★☆☆":"☆☆☆";
    return `<button class="chap" data-c="${k}"><small>Chapter ${k}</small><b>${CH[k]}</b>
      <small>${n} questions · best ${b}%</small><div class="stars">${st}</div></button>`;
  }).join("");
  const bd=Object.keys(BADGES).map(k=>`<span class="badge ${S.badges[k]?"on":""}">${BADGES[k][0]} ${BADGES[k][1]}</span>`).join("");
  app.innerHTML=`
   <h1>📦 Logistics Quest</h1>
   <p style="color:var(--mut);margin-top:0">${Q.length} questions drawn from your 7 chapters (1, 2, 3, 4, 5, 6, 12). Earn XP, build streaks, unlock badges.</p>
   <div class="modes">
     <button class="mode m4" id="mExam">🎓 Mock exam<small>20 mixed questions, scored out of 20</small></button>
     <button class="mode m2" id="mSurv">💀 Survival mode<small>3 lives, endless questions: beat your record</small></button>
     <button class="mode m3" id="mWrong">🩹 My mistakes<small>${S.wrong.length} question(s) to review</small></button>
   </div>
   <div class="opt-row"><label><input type="checkbox" id="oTimer" ${opts.timer?"checked":""}> ⏱️ 20 s timer per question (XP bonus if fast)</label></div>
   <h2>Chapters</h2><div class="grid">${cards}</div>
   <h2>Badges</h2><div class="badges">${bd}</div>
   <p style="color:var(--mut);font-size:.8rem">Tip: press 1-4 to answer, Enter to continue. Your progress is saved in this browser.</p>`;
  $("#oTimer").onchange=e=>opts.timer=e.target.checked;
  app.querySelectorAll(".chap").forEach(b=>b.onclick=()=>start({mode:"chap",c:+b.dataset.c}));
  $("#mExam").onclick=()=>start({mode:"exam"});
  $("#mSurv").onclick=()=>start({mode:"surv"});
  $("#mWrong").onclick=()=>{ if(!S.wrong.length) return toast("No mistakes recorded, well done!"); start({mode:"wrong"}); };
}

/* ============ GAME ============ */
let G=null, timerId=null;
function start(cfg){
  let pool;
  if(cfg.mode==="chap") pool=shuffle(Q.filter(x=>x.c===cfg.c));
  else if(cfg.mode==="exam") pool=shuffle(Q).slice(0,20);
  else if(cfg.mode==="surv") pool=shuffle(Q);
  else pool=shuffle(S.wrong.map(i=>Q[i]).filter(Boolean));
  G={cfg,pool,i:0,score:0,streak:0,maxStreak:0,lives:3,gained:0,miss:[],answered:false,t0:0,fast:0};
  next();
}
function lvlUpCheck(before){ const a=lvlInfo().i; if(a>before){toast("⬆️ Level "+(a+1)+": "+lvlInfo().name);fx(120);} }
function next(){
  clearInterval(timerId);
  if(G.i>=G.pool.length || (G.cfg.mode==="surv" && G.lives<=0)) return end();
  const Qs=G.pool[G.i]; G.cur=Qs; G.answered=false;
  const all=shuffle([{t:Qs.good,ok:true},...Qs.bad.map(t=>({t,ok:false}))]); G.opts=all;
  const surv=G.cfg.mode==="surv";
  const total=surv?"∞":G.pool.length;
  app.innerHTML=`
   <div class="hud">
     <span class="pill">Question <b>${G.i+1}</b>/${total}</span>
     <span class="pill">🔥 Streak <b id="stk">${G.streak}</b></span>
     <span class="pill">✨ <b id="gx">${G.gained}</b> XP</span>
     ${surv?`<span class="hearts" id="hr">${"❤️".repeat(G.lives)}${"🖤".repeat(3-G.lives)}</span>`:""}
     <a class="link" id="quit" style="margin-left:auto">Quit</a>
   </div>
   ${surv?"":`<div class="prog"><i style="width:${G.i/G.pool.length*100}%"></i></div>`}
   ${opts.timer?`<div class="timer"><i id="tm"></i></div>`:""}
   <div class="q">
     <div class="tag">Ch. ${Qs.c} · ${CH[Qs.c]}</div>
     <h3>${esc(Qs.t)}</h3>
     <div id="ans">${all.map((o,k)=>`<button class="ans" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(o.t)}</span></button>`).join("")}</div>
     <div id="fbx"></div>
   </div>`;
  app.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $("#quit").onclick=()=>{clearInterval(timerId);home();};
  G.t0=Date.now();
  if(opts.timer){
    const tm=$("#tm"); const dur=20000;
    timerId=setInterval(()=>{
      const r=Math.max(0,1-(Date.now()-G.t0)/dur);
      tm.style.width=r*100+"%"; tm.style.background=r>.5?"var(--ok)":r>.25?"var(--acc)":"var(--bad)";
      if(r<=0){clearInterval(timerId); answer(-1);}
    },100);
  }
}
function answer(k){
  if(G.answered) return; G.answered=true; clearInterval(timerId);
  const before=lvlInfo().i, Qs=G.cur, sec=(Date.now()-G.t0)/1000;
  const good=k>=0 && G.opts[k].ok;
  app.querySelectorAll(".ans").forEach((b,idx)=>{
    b.disabled=true;
    if(G.opts[idx].ok) b.classList.add("ok");
    else if(idx===k) b.classList.add("bad");
  });
  const qi=Q.indexOf(Qs);
  let msg;
  if(good){
    G.score++; G.streak++; G.maxStreak=Math.max(G.maxStreak,G.streak);
    let xp=10+Math.min(G.streak,6)*2;
    if(opts.timer && sec<8) xp+=Math.round(8-sec);
    if(sec<5){S.speedCount=(S.speedCount||0)+1; G.fast++;}
    S.xp+=xp; G.gained+=xp; flash("+"+xp+" XP");
    S.wrong=S.wrong.filter(x=>x!==qi);
    if(G.streak===5) giveBadge("s5"); if(G.streak===10) giveBadge("s10");
    giveBadge("first"); if(G.fast>=5) giveBadge("speed");
    msg=`<div class="fb ok"><b>✅ Correct!</b> ${esc(Qs.e)}</div>`;
  }else{
    G.streak=0; G.miss.push(Qs); if(G.cfg.mode==="surv") G.lives--;
    if(!S.wrong.includes(qi)) S.wrong.push(qi);
    msg=`<div class="fb bad"><b>${k<0?"⏰ Time's up.":"❌ Wrong."}</b> Correct answer: <b>${esc(Qs.good)}</b><br>${esc(Qs.e)}</div>`;
  }
  save(); renderTop(); lvlUpCheck(before);
  $("#stk").textContent=G.streak; $("#gx").textContent=G.gained;
  const hr=$("#hr"); if(hr) hr.textContent="❤️".repeat(Math.max(0,G.lives))+"🖤".repeat(3-Math.max(0,G.lives));
  const last=(G.i+1>=G.pool.length)||(G.cfg.mode==="surv"&&G.lives<=0);
  $("#fbx").innerHTML=msg+`<button class="btn" id="nx">${last?"See results 🏁":"Next →"}</button>`;
  $("#nx").onclick=()=>{G.i++;next();}; $("#nx").focus();
}
function flash(t){const d=document.createElement("div");d.className="xpfloat";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000);}

document.addEventListener("keydown",e=>{
  if(!G||!document.querySelector(".q")) return;
  if(!G.answered && e.key>="1" && e.key<="4"){ const k=+e.key-1; if(G.opts[k]) answer(k); }
  else if(G.answered && e.key==="Enter"){ const b=$("#nx"); if(b){e.preventDefault();b.click();} }
});

/* ============ END ============ */
function end(){
  clearInterval(timerId);
  const before=lvlInfo().i;
  const n=G.pool.length, sc=G.score, pct=n?Math.round(sc/n*100):0, cfg=G.cfg;
  let title="", extra="";
  if(cfg.mode==="chap"){
    S.best[cfg.c]=Math.max(S.best[cfg.c]||0,pct);
    if(pct===100) giveBadge("perfect");
    if(Object.keys(CH).every(k=>(S.best[k]||0)>=70)) giveBadge("all");
    title=`Chapter ${cfg.c} completed`;
  }else if(cfg.mode==="exam"){
    const note=(sc/n*20).toFixed(1);
    if(sc/n*20>=16) giveBadge("exam");
    title="Mock exam"; extra=`<div class="big">${note}/20</div>`;
  }else if(cfg.mode==="surv"){
    title="End of Survival mode"; extra=`<div class="big">${sc}</div><div>correct answers before the end</div>`;
    if(sc>=15) giveBadge("surv");
  }else title="Review session";
  const bonus=pct===100&&n>=5?50:0; if(bonus){S.xp+=bonus;G.gained+=bonus;}
  save(); renderTop(); lvlUpCheck(before);
  if(pct>=70||cfg.mode==="surv") fx(150);
  const rev=G.miss.map(m=>`<div class="rev"><b>${esc(m.t)}</b><br><span class="g">✔ ${esc(m.good)}</span><br><span style="color:var(--mut)">${esc(m.e)}</span></div>`).join("");
  const msg=pct>=90?"Impressive, you're ready for the exam! 🏆":pct>=70?"Very good, just a little more effort. 💪":"Read the corrections below and try again. 📚";
  app.innerHTML=`<div class="center">
    <h2>🏁 ${title}</h2>
    ${extra||`<div class="big">${pct}%</div>`}
    <p>${cfg.mode==="surv"?"":`${sc}/${n} correct answers · `}Best streak: ${G.maxStreak} 🔥 · <b>+${G.gained} XP</b>${bonus?" (incl. +50 perfect bonus)":""}</p>
    <p>${msg}</p>
    <button class="btn" id="again">Play again</button>
    <button class="btn sec" id="hm">Menu</button>
    ${G.miss.length?`<h3 style="margin-top:22px">To review (${G.miss.length})</h3>${rev}`:""}
  </div>`;
  $("#again").onclick=()=>start(cfg); $("#hm").onclick=home;
}
home();
</script>
</body>
</html>
